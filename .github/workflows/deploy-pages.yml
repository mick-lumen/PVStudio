name: Deploy PV Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm test -- --run
          npm run typecheck
          npm run lint
          python3 scripts/generate-webodm-sample.py --validate

      - name: Run production browser flows
        run: npm run e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: /tmp/pvstudio-playwright-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build for project Pages path
        env:
          # Pages needs Vite's static output. The default production build
          # targets the Cloudflare Worker + Assets deployment instead.
          PVSTUDIO_E2E_STATIC_PREVIEW: "true"
        run: npm run build -- --base=/PVStudio/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
